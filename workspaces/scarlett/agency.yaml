# Scarlett: the reviewer. She reviews plans and pull requests. She never
# writes code, edits a plan, or moves a card other than through the one board
# tool her stage allows.
#
# How work reaches Scarlett: Patch's board check (agency_tools.board.sweep)
# dispatches her stages with runtime.dispatch_task to this daemon. Each arrives
# as a routing.internal task whose taskType names the stage. She has no
# schedule and no providers.
#
# Runner: Codex. Her declared tools reach her through the Codex tool bridge in
# Agency, which gives `codex exec` the same agency-tools MCP server Claude runs
# get, limited to the rule's allowlist. Until that bridge ships, the codex runner
# ignores `tools:` and these rules cannot run as intended.
#
# Her run token (GITHUB_RUN_TOKEN_PERMISSIONS in agent.env) has no Projects
# and no contents write permission: she moves no card outside her board tools
# and pushes nothing.
#
# Separation of duties: Scarlett runs as her own macOS user with her own
# 1Password service account, the only one that can read the sc0red-scarlett
# App key. Her code review posts `scarlett/review/<base>` through
# agency_tools.scarlett.post_review, which runs the gate's own
# `scarlett-review` hook (engineering-standards gate/), never by hand.
#
# Concurrency (MAX_CONCURRENT_RUNS 1) lives in agent.env beside this file.

# Shared discipline: engineering-standards' shared/, vendored unedited into
# workspaces/shared/ and cited as {{system-doc:shared/<file>}}.
systemDocRoots:
  - ..

requireIntent: true

runner:
  type: codex

routing:
  internal:
    rules:
      # Plan Review. One verdict on Patch's plan. approve leaves the card in
      # Plan Review for the owner; changes_requested sends it back to Plan,
      # and a second one blocks it (board.post_verdict decides which).
      - name: plan-review
        condition:
          equals: { field: taskType, value: plan-review }
        messageTemplate: templates/plan-review.md
        deliverable: decision
        risk: low
        runTimeoutSecs: 1800
        singleFlightKey: '{{ repo }}#{{ issue }}'
        singleFlightTtlSecs: 3600
        singleFlightFailClosed: true
        identity:
          soul: true
        tools:
          - module.python: agency_tools.board.read
          - module.python: agency_tools.board.post_verdict
          - module.python: agency_tools.board.block

      # Code Review. Read-only: she reads the diff in a read-only checkout of
      # the head, runs Astra in its read-only sandbox, and reads GitHub's CI
      # results for the head. She never executes the PR's code, since she runs
      # as the user that can read her App key. On CI green and Astra "merge"
      # scarlett.post_review (the gate's scarlett-review hook, refused for any
      # other agent) posts scarlett/review/<base>, the status that lets the PR
      # merge. A failed required check posts neither a status nor a block:
      # she comments on the PR naming the check and ends the run. A CI-green
      # head that Astra does not pass gives board.block, for the owner.
      - name: code-review
        condition:
          equals: { field: taskType, value: code-review }
        messageTemplate: templates/code-review.md
        deliverable: decision
        risk: medium
        runTimeoutSecs: 5400
        singleFlightKey: '{{ repo }}#{{ issue }}'
        singleFlightTtlSecs: 7200
        singleFlightFailClosed: true
        identity:
          soul: true
        tools:
          - module.python: agency_tools.board.read
          - module.python: agency_tools.board.block
          - module.python: agency_tools.scarlett.post_review
