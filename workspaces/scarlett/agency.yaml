# Scarlett: the reviewer. She reviews plans and pull requests. She never
# writes code, edits a plan, or moves a card other than through the one board
# tool her stage allows.
#
# How work reaches Scarlett: Patch's board check (agency_tools.board.sweep)
# dispatches her stages with runtime.dispatch_task to this daemon. Each arrives
# as a routing.internal task whose taskType names the stage. She has no
# schedule and no providers.
#
# Runner: Codex. Her declared tools reach her through the Codex tool bridge in
# Agency, which gives `codex exec` the same agency-tools MCP server Claude runs
# get, limited to the rule's allowlist. Until that bridge ships, the codex runner
# ignores `tools:` and these rules cannot run as intended.
#
# Separation of duties: Scarlett runs as her own macOS user with her own
# 1Password service account, the only one that can read the sc0red-scarlett
# App key. Her code review posts `scarlett/review/<base>` through the gate's
# own `scarlett-review` tool (engineering-standards gate/), never by hand.
#
# Concurrency (MAX_CONCURRENT_RUNS 1) lives in agent.env beside this file.

systemDocRoots:
  - ../shared

requireIntent: true

runner:
  type: codex

routing:
  internal:
    rules:
      # Plan Review. One verdict on Patch's plan. approve leaves the card in
      # Plan Review for the owner; changes_requested sends it back to Plan,
      # and a second one blocks it (board.post_verdict decides which).
      - name: plan-review
        condition:
          equals: { field: taskType, value: plan-review }
        messageTemplate: templates/plan-review.md
        deliverable: decision
        risk: low
        runTimeoutSecs: 1800
        identity:
          soul: true
        tools:
          - module.python: agency_tools.board.read
          - module.python: agency_tools.board.post_verdict
          - module.python: agency_tools.board.block

      # Code Review. Her own Astra review of the PR head, in a worktree of her
      # own that holds only that head and its gate records, then the gate's
      # scarlett-review posts scarlett/review/<base>. That status is what lets
      # the PR merge.
      - name: code-review
        condition:
          equals: { field: taskType, value: code-review }
        messageTemplate: templates/code-review.md
        deliverable: decision
        risk: medium
        runTimeoutSecs: 5400
        identity:
          soul: true
        tools:
          - module.python: agency_tools.board.comment
          - module.python: agency_tools.board.block
