# Patch: the author. Plans, builds, fixes and merges the cards on the GitHub
# Project boards listed in boards.yaml.
#
# How work reaches Patch: the `board-check` schedule rule below runs
# agency_tools.board.sweep every two minutes and then stops, so no LLM run
# happens. The sweep reads each board, claims cards in Patch's and Scarlett's
# columns, and hands each stage to an agent with runtime.dispatch_task. The
# dispatch arrives here as a routing.internal task whose taskType names the
# stage. Patch never picks up work on its own and never moves a card except
# through the one board tool its stage allows.
#
# Every stage rule sets runTimeoutSecs. A run that times out or fails is
# reported as failed; the sweep re-dispatches it once and then blocks the card
# with the reason and the log tail.
#
# Card moves happen only inside the board.* tools, which hold the only token
# with Projects permission. Patch's own run token (the one `gh` and git use in
# Bash) is minted without it, so `gh project item-edit` cannot move a card.
#
# Concurrency (MAX_CONCURRENT_RUNS) is a daemon setting, not a workspace one;
# it lives in agent.env beside this file.
#
# Shared discipline (constitution, engineering loop, shipping, review core,
# issue-writing guides) is NOT copied here. engineering-standards stamps its
# shared/ directory as a sibling of the workspaces, and the templates pull it in
# with {{system-doc:<file>}} through the root below.

systemDocRoots:
  - ../shared

# Every template opens with an `## Intent` block.
requireIntent: true

runner:
  type: claude-cli
  model: claude-opus-5-5

routing:
  schedule:
    rules:
      # The board check. Deterministic: the sweep does all the work in preRun
      # and always_stop ends the rule before any LLM run is queued.
      - name: board-check
        cron: "*/2 * * * *"
        timezone: America/New_York
        messageTemplate: templates/board-check.md
        deliverable: action
        identity:
          soul: false
        preRunTools:
          - module.python: agency_tools.board.sweep
          - module.python: agency_tools.predicate.always_stop
        preRun:
          - name: sweep
            tool: agency_tools.board.sweep
            args:
              agent: patch
              config: boards.yaml
          - name: stop
            tool: agency_tools.predicate.always_stop
            args:
              reason: "board check ran in preRun; no LLM needed"
        tools: []

  internal:
    rules:
      # Plan → Planning. Investigate read-only, write the one plan comment,
      # or propose a split, or block with one question. Ends in Plan Review.
      - name: plan
        condition:
          equals: { field: taskType, value: plan }
        messageTemplate: templates/plan.md
        deliverable: action
        risk: low
        runTimeoutSecs: 2700
        identity:
          soul: true
        tools:
          - module.python: agency_tools.board.read
          - module.python: agency_tools.board.comment
          - module.python: agency_tools.board.submit_plan
          - module.python: agency_tools.board.propose_split
          - module.python: agency_tools.board.block

      # Ready for Development → In Development. Build exactly the approved
      # plan in an SSD worktree, clean make, Astra, open the PR through the
      # gate. Ends in Code Review.
      - name: build
        condition:
          equals: { field: taskType, value: build }
        messageTemplate: templates/build.md
        deliverable: action
        risk: medium
        runTimeoutSecs: 10800
        identity:
          soul: true
        tools:
          - module.python: agency_tools.board.read
          - module.python: agency_tools.board.comment
          - module.python: agency_tools.board.open_for_review
          - module.python: agency_tools.board.block

      # Code Review. CI failures and review threads are fixed in the same PR;
      # when Scarlett's status is green on the head, merge through the gate,
      # watch the deploy until the product works, then board.merged.
      - name: code-review
        condition:
          equals: { field: taskType, value: code-review }
        messageTemplate: templates/code-review.md
        deliverable: action
        risk: medium
        runTimeoutSecs: 7200
        identity:
          soul: true
        tools:
          - module.python: agency_tools.board.read
          - module.python: agency_tools.board.comment
          - module.python: agency_tools.board.merged
          - module.python: agency_tools.board.block

      # Hotfix. A fix against production plus the back-merge to the trunk.
      # Ends in Code Review like a build.
      - name: hotfix
        condition:
          equals: { field: taskType, value: hotfix }
        messageTemplate: templates/hotfix.md
        deliverable: action
        risk: high
        runTimeoutSecs: 10800
        identity:
          soul: true
        tools:
          - module.python: agency_tools.board.read
          - module.python: agency_tools.board.comment
          - module.python: agency_tools.board.open_for_review
          - module.python: agency_tools.board.block
