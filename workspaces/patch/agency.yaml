# Patch: the author. Plans, builds, fixes and merges the cards on the GitHub
# Project boards named in the board-check rule below.
#
# How work reaches Patch: the `board-check` schedule rule below runs
# agency_tools.board.sweep every two minutes and then stops, so no LLM run
# happens. The sweep reads each board, claims cards in Patch's and Scarlett's
# columns, and hands each stage to an agent with runtime.dispatch_task. The
# dispatch arrives here as a routing.internal task whose taskType names the
# stage. Patch never picks up work on its own and never moves a card except
# through the one board tool its stage allows.
#
# Every stage rule sets runTimeoutSecs. A run that times out or fails is
# reported as failed; the sweep re-dispatches it once and then blocks the card
# with the reason and the log tail.
#
# Every stage rule also runs at most one job per card: singleFlightKey
# '{{ repo }}#{{ issue }}', a lock TTL of runTimeoutSecs plus the sweep's
# queue wait, and singleFlightFailClosed, so a dispatch the gate cannot check
# (Redis down) is held and redelivered, never run beside a live one. A
# dispatch that coalesces runs once the live job ends; its template stops when
# the card has left the column it was dispatched for. The daemon's REDIS_URL
# (agent.env) is required.
#
# Card moves happen only inside the board.* tools, which hold the only token
# with Projects permission. Patch's own run token (the one `gh` and git use in
# Bash, and his GitHub tools) comes from each stage rule's githubRunToken: the
# daemon signs the run a claim for the card's repo and mints a fresh
# sc0red-patch token on every use, with those permissions and no Projects
# permission, so `gh project item-edit` cannot move a card. The App's id and
# key (BOARD_GITHUB_APP_ID, BOARD_GITHUB_APP_PRIVATE_KEY in op-bindings.json)
# never reach the run.
#
# Concurrency (MAX_CONCURRENT_RUNS) is a daemon setting, not a workspace one;
# it lives in agent.env beside this file.
#
# Shared discipline (constitution, engineering loop, shipping, review core,
# issue-writing guides) is engineering-standards' shared/, vendored unedited
# into workspaces/shared/ (`make vendor-shared`; `make` fails on drift). The
# templates cite it with {{system-doc:shared/<file>}} through the root below,
# engineering-standards' loading contract.

systemDocRoots:
  - ..

# Every template opens with an `## Intent` block.
requireIntent: true

runner:
  type: claude-cli
  model: claude-opus-5-5

routing:
  schedule:
    rules:
      # The board check. Deterministic: the sweep does all the work in preRun
      # and always_stop ends the rule before any LLM run is queued.
      - name: board-check
        cron: "*/2 * * * *"
        timezone: America/New_York
        messageTemplate: templates/board-check.md
        deliverable: action
        identity:
          soul: false
        preRunTools:
          - module.python: agency_tools.board.sweep
          - module.python: agency_tools.predicate.always_stop
        preRun:
          # One sweep step per live board, naming it in boards.json (this
          # workspace). The board config lives there and nowhere else, so the
          # sweep and the card tools (board.open_for_review and board.merged
          # read a repo's production_branch from it) work from one config:
          # its project, the repos it covers, each repo's production_branch
          # (the branch a hotfix's fix must target and merge into), which
          # agent and stage each column dispatches, how long a dispatch with
          # no known outcome holds its slot (stall_minutes, longer than the
          # stage rule's runTimeoutSecs plus queue wait), and run slots (the
          # sweep counts them per board, so each agent's slots summed over
          # every board must equal MAX_CONCURRENT_RUNS in its agent.env). Who a block
          # mentions is BOARD_NOTIFY_LOGIN in agent.env.
          # Code Review has two turns per PR head: Scarlett (the reviewer)
          # first; Patch once her scarlett/review/<base> status, posted by the
          # sc0red-scarlett App, is green on the head.
          # Ready for Development is not a stage column: the owner moves cards
          # there and the sweep claims them into In Development.
          # Overlap: a schedule rule takes no singleFlightKey. One daemon fires
          # this rule from a loop that awaits each fire, preRun included, so
          # its own passes are serial, except that a fire missed at boot is
          # recovered beside the loop. Only one Patch daemon may run this
          # workspace. The sweep re-reads each card around every write, which
          # narrows but does not close a race between two overlapping passes:
          # they can dispatch the same card twice. The stage rules close it:
          # each has singleFlightKey '{{ repo }}#{{ issue }}', so a second
          # dispatch of a stage for a card coalesces behind that stage's live
          # run. The lock is per stage rule and per agent's Redis, not per
          # card across stages: board.open_for_review's registration relies
          # on it because only the card's current column's stage can
          # register (its column guard refuses the others).
          - name: sweepNeurobloom
            tool: agency_tools.board.sweep
            args:
              board: neurobloom
          - name: sweepWinston
            tool: agency_tools.board.sweep
            args:
              board: winston
          - name: stop
            tool: agency_tools.predicate.always_stop
            args:
              reason: "board check ran in preRun; no LLM needed"
        tools: []

  internal:
    rules:
      # Plan → Planning. Investigate read-only, write the one plan comment,
      # or propose a split, or block with one question. Ends in Plan Review.
      - name: plan
        condition:
          equals: { field: taskType, value: plan }
        messageTemplate: templates/plan.md
        deliverable: action
        risk: low
        runTimeoutSecs: 2700
        githubRunToken:
          appIdSecret: BOARD_GITHUB_APP_ID
          appKeySecret: BOARD_GITHUB_APP_PRIVATE_KEY
          permissions: contents:write,pull_requests:write,issues:write,workflows:write,actions:read,checks:read,statuses:read,metadata:read
        singleFlightKey: '{{ repo }}#{{ issue }}'
        singleFlightTtlSecs: 4500
        singleFlightFailClosed: true
        identity:
          soul: true
        tools:
          - module.python: agency_tools.board.read
          - module.python: agency_tools.board.submit_plan
          - module.python: agency_tools.board.propose_split
          - module.python: agency_tools.board.block

      # Ready for Development → In Development. Build exactly the approved
      # plan in an SSD worktree, clean make, Astra, open the PR through the
      # gate. Ends in Code Review.
      - name: build
        condition:
          equals: { field: taskType, value: build }
        messageTemplate: templates/build.md
        deliverable: action
        risk: medium
        runTimeoutSecs: 10800
        githubRunToken:
          appIdSecret: BOARD_GITHUB_APP_ID
          appKeySecret: BOARD_GITHUB_APP_PRIVATE_KEY
          permissions: contents:write,pull_requests:write,issues:write,workflows:write,actions:read,checks:read,statuses:read,metadata:read
        singleFlightKey: '{{ repo }}#{{ issue }}'
        singleFlightTtlSecs: 12600
        singleFlightFailClosed: true
        identity:
          soul: true
        tools:
          - module.python: agency_tools.board.read
          - module.python: agency_tools.board.open_for_review
          - module.python: agency_tools.board.block

      # Code Review, after Scarlett's status is green on the head (the sweep
      # sends her each new head first). CI failures and review threads are
      # fixed in the same PR; then merge through the gate, watch the deploy
      # until the product works, then board.merged. board.block on failure.
      - name: code-review
        condition:
          equals: { field: taskType, value: code-review }
        messageTemplate: templates/code-review.md
        deliverable: action
        risk: medium
        runTimeoutSecs: 7200
        githubRunToken:
          appIdSecret: BOARD_GITHUB_APP_ID
          appKeySecret: BOARD_GITHUB_APP_PRIVATE_KEY
          permissions: contents:write,pull_requests:write,issues:write,workflows:write,actions:read,checks:read,statuses:read,metadata:read
        singleFlightKey: '{{ repo }}#{{ issue }}'
        singleFlightTtlSecs: 9000
        singleFlightFailClosed: true
        identity:
          soul: true
        tools:
          - module.python: agency_tools.board.read
          - module.python: agency_tools.board.merged
          - module.python: agency_tools.board.block

      # Hotfix. A fix against production plus the back-merge to the trunk.
      # Ends in Code Review like a build. No stage rule can reach Ready for
      # Development: no board tool makes that move.
      - name: hotfix
        condition:
          equals: { field: taskType, value: hotfix }
        messageTemplate: templates/hotfix.md
        deliverable: action
        risk: high
        runTimeoutSecs: 10800
        githubRunToken:
          appIdSecret: BOARD_GITHUB_APP_ID
          appKeySecret: BOARD_GITHUB_APP_PRIVATE_KEY
          permissions: contents:write,pull_requests:write,issues:write,workflows:write,actions:read,checks:read,statuses:read,metadata:read
        singleFlightKey: '{{ repo }}#{{ issue }}'
        singleFlightTtlSecs: 12600
        singleFlightFailClosed: true
        identity:
          soul: true
        tools:
          - module.python: agency_tools.board.read
          - module.python: agency_tools.board.open_for_review
          - module.python: agency_tools.board.block

      # New → Triage on Winston's board. Each board has its own guide (owner:
      # "the guides will be different for each project"): the board's Triage
      # stage in boards.json names its own task_type, whose rule and template
      # cite that board's guide, here engineering-standards'
      # business-value-winston.md. A board with no Triage stage (NeuroBloom,
      # until its guide is in) leaves its New cards where they are.
      # Propose the card's Business Value, write the reason into the issue,
      # and leave it in Backlog. Short and cheap on purpose: Sonnet at
      # low effort, a small turn budget and a 10-minute timeout, read-only
      # GitHub access. The sweep dispatches Triage after every other stage,
      # so with one Patch slot per board a plan or build waits behind at most
      # one triage run.
      - name: triage-winston
        condition:
          equals: { field: taskType, value: triage-winston }
        messageTemplate: templates/triage-winston.md
        deliverable: action
        risk: low
        model: claude-sonnet-5-5
        effort: low
        maxTurns: 15
        runTimeoutSecs: 600
        githubRunToken:
          appIdSecret: BOARD_GITHUB_APP_ID
          appKeySecret: BOARD_GITHUB_APP_PRIVATE_KEY
          permissions: contents:read,issues:read,metadata:read
        singleFlightKey: '{{ repo }}#{{ issue }}'
        singleFlightTtlSecs: 2400
        singleFlightFailClosed: true
        identity:
          soul: false
        tools:
          - module.python: agency_tools.board.read
          - module.python: agency_tools.board.rate_value
          - module.python: agency_tools.board.block
